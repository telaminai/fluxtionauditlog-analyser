name: Starter evidence static checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Pinned finished-project corpus (no client or journal collection)
        run: python3 tools/check_coldstart_corpus.py --scorer-revision 18b47a7
      - name: Observer clock regressions
        run: python3 -m unittest discover -s tools -p test_coldstart_clock.py
