name: Release

# One click: Actions → Release → Run workflow → type the version (e.g. 1.4.2). Everything else —
# tests, changelog stamp, tag, fatjar build, GitHub release with assets + checksums — is automated (M16 §6).
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.4.2 — no leading v)'
        required: true

permissions:
  contents: write   # push the changelog commit + tag and create the release, via GITHUB_TOKEN
  actions: write    # dispatch the docs-site deploy at the end (GITHUB_TOKEN pushes never fire on:push)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify version input and that the tag is free
        run: |
          [[ "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad version (want MAJOR.MINOR.PATCH)"; exit 1; }
          git rev-parse "v${{ inputs.version }}" >/dev/null 2>&1 && { echo "tag v${{ inputs.version }} already exists"; exit 1; } || true

      # Tests gate the release: nothing below runs (or is committed) unless this is green.
      - name: Run tests
        run: mvn -B verify

      - name: Stamp changelog (Unreleased -> version + date) and extract notes
        id: notes
        run: |
          DATE=$(date -u +%Y-%m-%d)
          # the Unreleased body becomes the release notes
          awk '/^## \[Unreleased\]/{f=1;next} /^## \[/{f=0} f' CHANGELOG.md > /tmp/notes.md
          # refuse to publish an empty changelog section — a release must describe what changed
          grep -q '[^[:space:]]' /tmp/notes.md || { echo "CHANGELOG [Unreleased] is empty — add release notes first"; exit 1; }
          # rename Unreleased -> the version, insert a fresh empty Unreleased above it
          sed -i "s/^## \[Unreleased\]/## [Unreleased]\n\n## [${{ inputs.version }}] - ${DATE}/" CHANGELOG.md
          echo "" >> /tmp/notes.md
          echo "Full commit log: https://github.com/${{ github.repository }}/commits/v${{ inputs.version }}" >> /tmp/notes.md

      - name: Commit changelog + tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "Release ${{ inputs.version }} — stamp changelog"
          git tag "v${{ inputs.version }}"
          git push origin HEAD --tags

      - name: Build fatjar with the release version stamped in
        run: |
          mvn -B versions:set -DnewVersion=${{ inputs.version }} -DgenerateBackupPoms=false
          mvn -B -DskipTests package
          # stable-name copy so releases/latest/download/… never changes (JBang + website point here)
          cp target/fluxtion-auditlog-analyser-${{ inputs.version }}.jar fluxtion-auditlog-analyser.jar
          sha256sum fluxtion-auditlog-analyser.jar target/fluxtion-auditlog-analyser-${{ inputs.version }}.jar > SHA256SUMS.sha256

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          body_path: /tmp/notes.md
          files: |
            target/fluxtion-auditlog-analyser-${{ inputs.version }}.jar
            fluxtion-auditlog-analyser.jar
            SHA256SUMS.sha256

      # The changelog-stamp push above uses GITHUB_TOKEN, which never triggers on:push workflows —
      # so kick the docs deploy explicitly, or the site's release-notes page misses the release.
      - name: Refresh the docs site (release-notes page)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
