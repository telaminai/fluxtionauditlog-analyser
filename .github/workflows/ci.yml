name: CI

# main must be green before it can be released; the release workflow re-verifies too (M16 §5).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # UI classes are only constructed, never shown, so the headless ubuntu runner is fine.
      - run: mvn -B verify
