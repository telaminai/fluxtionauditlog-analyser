name: CI

# main must be green before it can be released; the release workflow re-verifies too (M16 §5).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    # A docs-only change (Markdown outside src/ and docs/skills/, or a site image — see tools/ci_docs_only.py) skips the
    # expensive jobs below. `build` always runs: documentation is an input to the headless tests (spec links, CLAUDE.md,
    # the site pages, runbooks). Any doubt — a new branch, a failed diff, this job failing — runs everything.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: classify
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            python3 tools/ci_docs_only.py "$PR_BASE" "$PR_HEAD" --three-dot >> "$GITHUB_OUTPUT"
          else
            python3 tools/ci_docs_only.py "$PUSH_BEFORE" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # full history: CanonicalSkillsTest verifies the published skills index against the git revision it
          # pins (git show <sha>:path); the default one-commit checkout cannot see it and failed main since 2026-09-04
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test generated-bundle contract preflight
        run: python3 -m unittest tools/bench/test_bundle_bench.py

      - name: dispatch bench harness tests (M46/W10)
        run: python3 -m unittest tools/bench/test_dispatch_bench.py
      # M48: the resolver and mode selector carry a product argument. Without this line a
      # regression only fails when somebody remembers a separate command.
      - name: Resolver and mode-selector smoke tests
        run: python3 tools/test_tools.py
      - name: Acceptance analyser supervision tests
        run: python3 tools/test_analyser_session_watch.py
      # The G14 harness grants the compilation key, and its key-leak scan is the declared
      # compensating control. Under rule 8 a check that never runs is not a check, so the scan's
      # regression tests run here. They patch KEY_FILE and TRIAL_TOKEN onto temporary files, start
      # no model session and contact no network.
      - name: G14 harness tests (key-leak scan, group reaping, refusals)
        run: python3 tools/test_g14_runner.py
      - name: Docs-only classifier tests (which changes may skip the expensive jobs)
        run: python3 tools/test_ci_docs_only.py
      # UI classes are only constructed, never shown, so the headless ubuntu runner is fine.
      - run: mvn -B verify

  loop-bench:
    # M19.8: this one DOES launch Swing. xvfb supplies the display while the stub and isolated home
    # keep the cross-repo contract deterministic and independent of a live Mongoose installation.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # full history: CanonicalSkillsTest verifies the published skills index against the git revision it
          # pins (git show <sha>:path); the default one-commit checkout cannot see it and failed main since 2026-09-04
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Package analyser
        run: mvn -B package -DskipTests
      - name: Run registry/export/analyser/MCP loop
        run: xvfb-run -a tools/bench/loop-bench.py --stub --launch
      - name: Verify session recovery across JVM restarts
        run: xvfb-run -a python3 tools/verify-session-restart.py

  ui-frame:
    # R2-F6 (1.13.1 review): PairingDuringLoadFrameTest constructs a real MainFrame and is SKIPPED under the
    # pom's forced headless run, so `build` alone never proves the pairing lifecycle. This job gives it a
    # display and fails if the suite skipped — a quiet skip is exactly the failure mode being closed.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Verify frame-suite registration and mutation anchors
        run: |
          python3 tools/test_project_chart_review.py
          python3 tools/verify_project_chart_review.py --mode preflight --output target/chart-preflight.json
      - name: Run the frame lifecycle tests on a display
        run: >
          xvfb-run -a mvn -B test -Dtest='PairingDuringLoadFrameTest,AsyncOpenInterleavingFrameTest,SpotlightFrameTest,WestColumnStartsCollapsedFrameTest,MenuScreenshotFrameTest,PersonAtTheScreenFrameTest,NamedGraphAndMenuSpotlightFrameTest,SessionRecoveryFrameTest,SourceFreshnessFrameTest,TemplateCatalogueFrameTest,DesignSpotlightFrameTest,JavaSourceSpotlightFrameTest,LoadedFileObservationFrameTest,ChartLifecycleReviewFrameTest,ProjectPanelChartLifecycleFrameTest,DuplicateGlobalChartsFrameTest,SilentActionDisclosureFrameTest,StatusExplanationSurvivesFrameTest,DuplicateChartRepairFrameTest,MenuLayoutFrameTest,NoLogDesignJourneyFrameTest,IdentityMarkFrameTest,LogFindingsOnEverySurfaceFrameTest,ReportRecoverableDeleteFrameTest,ChartDrawnFactFrameTest,WalkPlaybackFrameTest,WalkArrowKeysFrameTest,WalkVerbFrameTest,WalkReviewFrameTest,TableDragCancellationFrameTest'
          -Dsurefire.failIfNoSpecifiedTests=false -Djava.awt.headless=false -DargLine="-Djava.awt.headless=false"
      - name: Fail if any suite skipped
        run: |
          # SpotlightFrameTest (M64): pixel-samples the screenshot verb's image for the cut-out. It is the
          # only test that would notice the screenshot no longer compositing the glass pane.
          for c in PairingDuringLoadFrameTest AsyncOpenInterleavingFrameTest SpotlightFrameTest WestColumnStartsCollapsedFrameTest MenuScreenshotFrameTest PersonAtTheScreenFrameTest NamedGraphAndMenuSpotlightFrameTest SessionRecoveryFrameTest SourceFreshnessFrameTest TemplateCatalogueFrameTest DesignSpotlightFrameTest JavaSourceSpotlightFrameTest LoadedFileObservationFrameTest ChartLifecycleReviewFrameTest ProjectPanelChartLifecycleFrameTest DuplicateGlobalChartsFrameTest SilentActionDisclosureFrameTest StatusExplanationSurvivesFrameTest DuplicateChartRepairFrameTest MenuLayoutFrameTest NoLogDesignJourneyFrameTest IdentityMarkFrameTest LogFindingsOnEverySurfaceFrameTest ReportRecoverableDeleteFrameTest ChartDrawnFactFrameTest WalkPlaybackFrameTest WalkArrowKeysFrameTest WalkVerbFrameTest WalkReviewFrameTest TableDragCancellationFrameTest; do
            f=$(ls target/surefire-reports/TEST-*.$c.xml)   # anchored on the class name: NamedGraphAndMenuSpotlightFrameTest also ends in SpotlightFrameTest
            echo "$c $(grep -o 'tests="[0-9]*" errors="[0-9]*" skipped="[0-9]*" failures="[0-9]*"' "$f")"
            grep -q 'skipped="0"' "$f" || { echo "$c skipped — no display reached the JVM"; exit 1; }
            grep -q 'tests="0"' "$f" && { echo "$c: no tests ran"; exit 1; } || true
          done

  mutation-selftest:
    # Independent required job: do not put this setup cost in every shard's critical path.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test allocation and fail-closed collection
        run: python3 tools/test_mutation_shards.py
      - name: Check the fast engine, including real compile fallbacks
        run: python3 tools/verify_project_chart_review.py --mode selftest --output target/mutation-selftest.json
      - name: Keep the engine's evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-selftest
          path: target/mutation-selftest.json
          if-no-files-found: error

  mutation-shards:
    # Separate runners mean separate workspaces, class trees and Xvfb displays. Controls within a
    # shard remain sequential: one baseline, then named failure / byte restore / restored green.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Run this shard (full registry partition, never a changed-files subset)
        run: >
          xvfb-run -a python3 tools/verify_project_chart_review.py --mode mutations --engine fast
          --shard-index ${{ matrix.shard }} --shard-count 4
          --output target/mutation-shard-${{ matrix.shard }}.json
      - name: Keep partial evidence even when a control fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-shard-${{ matrix.shard }}
          path: target/mutation-shard-${{ matrix.shard }}.json
          if-no-files-found: error

  mutation-gate:
    # Preserve the existing required-check name. A failed/cancelled/skipped worker or self-test
    # fails this job; successful jobs must also prove complete, exactly-once control coverage.
    needs: [changes, mutation-selftest, mutation-shards]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Docs-only change — no mutation control can be affected
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "docs-only change; the mutation shards and self-test were skipped by design (tools/ci_docs_only.py)"
      - name: Require successful workers and engine self-test
        if: needs.changes.outputs.docs_only != 'true'
        env:
          SELFTEST_RESULT: ${{ needs.mutation-selftest.result }}
          SHARDS_RESULT: ${{ needs.mutation-shards.result }}
        run: |
          test "$SELFTEST_RESULT" = success && test "$SHARDS_RESULT" = success
      - uses: actions/download-artifact@v4
        if: needs.changes.outputs.docs_only != 'true'
        with:
          pattern: mutation-shard-*
          path: target/mutation-shards
          merge-multiple: true
      - name: Verify every current control exactly once against this revision
        if: needs.changes.outputs.docs_only != 'true'
        run: >
          python3 tools/mutation_shards.py --artifacts target/mutation-shards --count 4
          --revision "$GITHUB_SHA" --output target/mutation-gate.json
      - name: Keep the combined evidence
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mutation-gate
          path: target/mutation-gate.json
          if-no-files-found: error
