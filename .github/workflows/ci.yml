name: CI

# main must be green before it can be released; the release workflow re-verifies too (M16 §5).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # full history: CanonicalSkillsTest verifies the published skills index against the git revision it
          # pins (git show <sha>:path); the default one-commit checkout cannot see it and failed main since 2026-09-04
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test generated-bundle contract preflight
        run: python3 -m unittest tools/bench/test_bundle_bench.py

      - name: dispatch bench harness tests (M46/W10)
        run: python3 -m unittest tools/bench/test_dispatch_bench.py
      # M48: the resolver and mode selector carry a product argument. Without this line a
      # regression only fails when somebody remembers a separate command.
      - name: Resolver and mode-selector smoke tests
        run: python3 tools/test_tools.py
      - name: Acceptance analyser supervision tests
        run: python3 tools/test_analyser_session_watch.py
      # UI classes are only constructed, never shown, so the headless ubuntu runner is fine.
      - run: mvn -B verify

  loop-bench:
    # M19.8: this one DOES launch Swing. xvfb supplies the display while the stub and isolated home
    # keep the cross-repo contract deterministic and independent of a live Mongoose installation.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # full history: CanonicalSkillsTest verifies the published skills index against the git revision it
          # pins (git show <sha>:path); the default one-commit checkout cannot see it and failed main since 2026-09-04
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Package analyser
        run: mvn -B package -DskipTests
      - name: Run registry/export/analyser/MCP loop
        run: xvfb-run -a tools/bench/loop-bench.py --stub --launch
      - name: Verify session recovery across JVM restarts
        run: xvfb-run -a python3 tools/verify-session-restart.py

  ui-frame:
    # R2-F6 (1.13.1 review): PairingDuringLoadFrameTest constructs a real MainFrame and is SKIPPED under the
    # pom's forced headless run, so `build` alone never proves the pairing lifecycle. This job gives it a
    # display and fails if the suite skipped — a quiet skip is exactly the failure mode being closed.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Verify frame-suite registration and mutation anchors
        run: |
          python3 tools/test_project_chart_review.py
          python3 tools/verify_project_chart_review.py --mode preflight --output target/chart-preflight.json
      - name: Run the frame lifecycle tests on a display
        run: >
          xvfb-run -a mvn -B test -Dtest='PairingDuringLoadFrameTest,AsyncOpenInterleavingFrameTest,SpotlightFrameTest,WestColumnStartsCollapsedFrameTest,MenuScreenshotFrameTest,PersonAtTheScreenFrameTest,NamedGraphAndMenuSpotlightFrameTest,SessionRecoveryFrameTest,SourceFreshnessFrameTest,TemplateCatalogueFrameTest,DesignSpotlightFrameTest,JavaSourceSpotlightFrameTest,LoadedFileObservationFrameTest,ChartLifecycleReviewFrameTest,ProjectPanelChartLifecycleFrameTest,DuplicateGlobalChartsFrameTest,SilentActionDisclosureFrameTest,StatusExplanationSurvivesFrameTest,DuplicateChartRepairFrameTest,MenuLayoutFrameTest,NoLogDesignJourneyFrameTest'
          -Dsurefire.failIfNoSpecifiedTests=false -Djava.awt.headless=false -DargLine="-Djava.awt.headless=false"
      - name: Fail if any suite skipped
        run: |
          # SpotlightFrameTest (M64): pixel-samples the screenshot verb's image for the cut-out. It is the
          # only test that would notice the screenshot no longer compositing the glass pane.
          for c in PairingDuringLoadFrameTest AsyncOpenInterleavingFrameTest SpotlightFrameTest WestColumnStartsCollapsedFrameTest MenuScreenshotFrameTest PersonAtTheScreenFrameTest NamedGraphAndMenuSpotlightFrameTest SessionRecoveryFrameTest SourceFreshnessFrameTest TemplateCatalogueFrameTest DesignSpotlightFrameTest JavaSourceSpotlightFrameTest LoadedFileObservationFrameTest ChartLifecycleReviewFrameTest ProjectPanelChartLifecycleFrameTest DuplicateGlobalChartsFrameTest SilentActionDisclosureFrameTest StatusExplanationSurvivesFrameTest DuplicateChartRepairFrameTest MenuLayoutFrameTest NoLogDesignJourneyFrameTest; do
            f=$(ls target/surefire-reports/TEST-*.$c.xml)   # anchored on the class name: NamedGraphAndMenuSpotlightFrameTest also ends in SpotlightFrameTest
            echo "$c $(grep -o 'tests="[0-9]*" errors="[0-9]*" skipped="[0-9]*" failures="[0-9]*"' "$f")"
            grep -q 'skipped="0"' "$f" || { echo "$c skipped — no display reached the JVM"; exit 1; }
            grep -q 'tests="0"' "$f" && { echo "$c: no tests ran"; exit 1; } || true
          done

  mutation-gate:
    # PR #16 (docs/proposals/faster-mutation-gate.md): the FULL set of mutation controls, on every PR to main and
    # every push to main. Until this job the controls ran only by hand. The fast engine compiles once, then per
    # control javac's the one mutated file and runs the named test in a fresh JVM; `--mode compare` is how it was
    # shown to give the Maven engine's verdicts. Controls are not parallelised: under one xvfb display they would
    # contend for focus, and the gate's value is that a red means something.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Check the fast engine's compile-fallback detection
        run: python3 tools/verify_project_chart_review.py --mode selftest --output target/mutation-selftest.json
      - name: Run every mutation control (fast engine)
        run: xvfb-run -a python3 tools/verify_project_chart_review.py --mode mutations --engine fast --output target/mutation-gate.json
      - name: Keep the gate's evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-gate
          path: target/mutation-*.json
