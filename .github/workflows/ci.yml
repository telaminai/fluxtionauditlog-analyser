name: CI

# main must be green before it can be released; the release workflow re-verifies too (M16 §5).
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main, acceptance/mg-lifecycle-base-20261005]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

# Only newer runs of this workflow for the SAME PR supersede one another.
# Unique non-PR keys prevent even pending main runs from being replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # A docs-only change (Markdown outside src/ and docs/skills/, or a site image — see tools/ci_docs_only.py) skips the
    # expensive jobs below. `build` always runs: documentation is an input to the headless tests (spec links, CLAUDE.md,
    # the site pages, runbooks). Any doubt — a new branch, a failed diff, this job failing — runs everything.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      mutation_mode: ${{ steps.mutations.outputs.mutation_mode }}
      shard_count: ${{ steps.mutations.outputs.shard_count }}
      shard_matrix: ${{ steps.mutations.outputs.shard_matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: classify
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            python3 tools/ci_docs_only.py "$PR_BASE" "$PR_HEAD" --three-dot >> "$GITHUB_OUTPUT"
          else
            python3 tools/ci_docs_only.py "$PUSH_BEFORE" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

      - id: mutations
        if: steps.classify.outputs.docs_only != 'true'
        env:
          EVENT: ${{ github.event_name }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 tools/mutation_policy.py --output target/mutation-plan.json >> "$GITHUB_OUTPUT"
      - name: Keep selection and candidate provenance
        if: always() && steps.classify.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mutation-plan
          path: target/mutation-plan.json
          if-no-files-found: error

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # full history: CanonicalSkillsTest verifies the published skills index against the git revision it
          # pins (git show <sha>:path); the default one-commit checkout cannot see it and failed main since 2026-09-04
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test generated-bundle contract preflight
        run: python3 -m unittest tools/bench/test_bundle_bench.py

      - name: dispatch bench harness tests (M46/W10)
        run: python3 -m unittest tools/bench/test_dispatch_bench.py
      # M48: the resolver and mode selector carry a product argument. Without this line a
      # regression only fails when somebody remembers a separate command.
      - name: Resolver and mode-selector smoke tests
        run: python3 tools/test_tools.py
      - name: Acceptance analyser supervision tests
        run: python3 tools/test_analyser_session_watch.py
      # The G14 harness grants the compilation key, and its key-leak scan is the declared
      # compensating control. Under rule 8 a check that never runs is not a check, so the scan's
      # regression tests run here. They patch KEY_FILE and TRIAL_TOKEN onto temporary files, start
      # no model session and contact no network.
      - name: G14 harness tests (key-leak scan, group reaping, refusals)
        run: python3 tools/test_g14_runner.py
      - name: Mutation policy and evidence tests (no mutation execution)
        run: |
          python3 tools/test_mutation_shards.py
          python3 tools/test_mutation_iteration.py
          python3 tools/test_project_chart_review.py
      - name: Docs-only classifier tests (which changes may skip the expensive jobs)
        run: python3 tools/test_ci_docs_only.py
      - name: Evidence bundle driver tests (the capture skill's refusals, headless)
        run: python3 tools/test_evidence_bundle_demo.py
      # UI classes are only constructed, never shown, so the headless ubuntu runner is fine.
      - run: mvn -B verify

  loop-bench:
    # M19.8: this one DOES launch Swing. xvfb supplies the display while the stub and isolated home
    # keep the cross-repo contract deterministic and independent of a live Mongoose installation.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # full history: CanonicalSkillsTest verifies the published skills index against the git revision it
          # pins (git show <sha>:path); the default one-commit checkout cannot see it and failed main since 2026-09-04
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Package analyser
        run: mvn -B package -DskipTests
      - name: Run registry/export/analyser/MCP loop
        run: xvfb-run -a tools/bench/loop-bench.py --stub --launch
      - name: Verify session recovery across JVM restarts
        run: xvfb-run -a python3 tools/verify-session-restart.py

  ui-frame:
    # R2-F6 (1.13.1 review): PairingDuringLoadFrameTest constructs a real MainFrame and is SKIPPED under the
    # pom's forced headless run, so `build` alone never proves the pairing lifecycle. This job gives it a
    # display and fails if the suite skipped — a quiet skip is exactly the failure mode being closed.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Verify frame-suite registration and mutation anchors
        run: |
          python3 tools/test_project_chart_review.py
          python3 tools/verify_project_chart_review.py --mode preflight --output target/chart-preflight.json
      - name: Run the frame lifecycle tests on a display
        run: >
          xvfb-run -a mvn -B test -Dtest='PairingDuringLoadFrameTest,AsyncOpenInterleavingFrameTest,SpotlightFrameTest,WestColumnStartsCollapsedFrameTest,MenuScreenshotFrameTest,PersonAtTheScreenFrameTest,NamedGraphAndMenuSpotlightFrameTest,SessionRecoveryFrameTest,SourceFreshnessFrameTest,TemplateCatalogueFrameTest,DesignSpotlightFrameTest,JavaSourceSpotlightFrameTest,LoadedFileObservationFrameTest,ChartLifecycleReviewFrameTest,ProjectPanelChartLifecycleFrameTest,DuplicateGlobalChartsFrameTest,SilentActionDisclosureFrameTest,StatusExplanationSurvivesFrameTest,DuplicateChartRepairFrameTest,MenuLayoutFrameTest,NoLogDesignJourneyFrameTest,IdentityMarkFrameTest,LogFindingsOnEverySurfaceFrameTest,ReportRecoverableDeleteFrameTest,ChartDrawnFactFrameTest,WalkPlaybackFrameTest,WalkArrowKeysFrameTest,WalkVerbFrameTest,WalkReviewFrameTest,ContextLogGenerationFrameTest,EvidenceCaptureFrameTest,TableDragCancellationFrameTest,StartWorkspaceFrameTest,AssistantLiveFrameTest,AssistantScopeRaceFrameTest,BrokenValueFrameTest,AssistantHostFrameTest,AssistantNativeFrameTest,ConversationEditorFrameTest,ConversationJourneyFrameTest,BundleProvenanceFrameTest,Issue84BundleFrameTest,Issue84JavaWalkFrameTest'
          -Dsurefire.failIfNoSpecifiedTests=false -Djava.awt.headless=false -DargLine="-Djava.awt.headless=false"
      - name: Fail if any suite skipped
        run: |
          # SpotlightFrameTest (M64): pixel-samples the screenshot verb's image for the cut-out. It is the
          # only test that would notice the screenshot no longer compositing the glass pane.
          for c in PairingDuringLoadFrameTest AsyncOpenInterleavingFrameTest SpotlightFrameTest WestColumnStartsCollapsedFrameTest MenuScreenshotFrameTest PersonAtTheScreenFrameTest NamedGraphAndMenuSpotlightFrameTest SessionRecoveryFrameTest SourceFreshnessFrameTest TemplateCatalogueFrameTest DesignSpotlightFrameTest JavaSourceSpotlightFrameTest LoadedFileObservationFrameTest ChartLifecycleReviewFrameTest ProjectPanelChartLifecycleFrameTest DuplicateGlobalChartsFrameTest SilentActionDisclosureFrameTest StatusExplanationSurvivesFrameTest DuplicateChartRepairFrameTest MenuLayoutFrameTest NoLogDesignJourneyFrameTest IdentityMarkFrameTest LogFindingsOnEverySurfaceFrameTest ReportRecoverableDeleteFrameTest ChartDrawnFactFrameTest WalkPlaybackFrameTest WalkArrowKeysFrameTest WalkVerbFrameTest WalkReviewFrameTest ContextLogGenerationFrameTest EvidenceCaptureFrameTest TableDragCancellationFrameTest StartWorkspaceFrameTest AssistantLiveFrameTest AssistantScopeRaceFrameTest BrokenValueFrameTest AssistantHostFrameTest AssistantNativeFrameTest ConversationEditorFrameTest ConversationJourneyFrameTest BundleProvenanceFrameTest Issue84BundleFrameTest Issue84JavaWalkFrameTest; do
            f=$(ls target/surefire-reports/TEST-*.$c.xml)   # anchored on the class name: NamedGraphAndMenuSpotlightFrameTest also ends in SpotlightFrameTest
            echo "$c $(grep -o 'tests="[0-9]*" errors="[0-9]*" skipped="[0-9]*" failures="[0-9]*"' "$f")"
            grep -q 'skipped="0"' "$f" || { echo "$c skipped — no display reached the JVM"; exit 1; }
            grep -q 'tests="0"' "$f" && { echo "$c: no tests ran"; exit 1; } || true
          done

  mutation-selftest:
    # Independent full-gate job: do not put this setup cost in every shard's critical path.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.mutation_mode == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test allocation and fail-closed collection
        run: python3 tools/test_mutation_shards.py
      - name: Check the fast engine, including real compile fallbacks
        run: python3 tools/verify_project_chart_review.py --mode selftest --output target/mutation-selftest.json
      - name: Keep the engine's evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-selftest
          path: target/mutation-selftest.json
          if-no-files-found: error

  mutation-shards:
    # Separate runners mean separate workspaces, class trees and Xvfb displays. Controls within a
    # shard remain sequential: one baseline, then named failure / byte restore / restored green.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.mutation_mode == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.shard_matrix) }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Run this shard (full registry partition, never a changed-files subset)
        run: >
          xvfb-run -a python3 tools/verify_project_chart_review.py --mode mutations --engine fast
          --shard-index ${{ matrix.shard }} --shard-count ${{ needs.changes.outputs.shard_count }}
          --output target/mutation-shard-${{ matrix.shard }}.json
      - name: Keep partial evidence even when a control fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-shard-${{ matrix.shard }}
          path: target/mutation-shard-${{ matrix.shard }}.json
          if-no-files-found: error

  mutation-feedback:
    # Explicitly partial draft feedback; never consumed by the full collector.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.mutation_mode == 'feedback' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Run selected witnesses only
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: >
          xvfb-run -a python3 tools/verify_project_chart_review.py --mode mutations --engine fast
          --changed-since "$PR_BASE" --output target/mutation-feedback.json
      - name: Keep selected, caught and not-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-feedback
          path: target/mutation-feedback.json
          if-no-files-found: error

  mutation-gate:
    # Same check name; manual enforcement (MG-O1). Deferred draft means FAILURE, never neutral/skip.
    needs: [changes, mutation-selftest, mutation-shards]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Require a successful policy decision
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
        run: test "$CHANGES_RESULT" = success
      - name: Docs-only exemption (not an all-controls claim)
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "docs-only change; mutation work omitted by tools/ci_docs_only.py"
      - name: Full gate deferred while draft
        if: needs.changes.outputs.mutation_mode == 'feedback'
        run: |
          echo "full gate deferred while draft; mark ready to run"
          exit 1
      - name: Require successful workers and engine self-test
        if: needs.changes.outputs.docs_only != 'true'
        env:
          MODE: ${{ needs.changes.outputs.mutation_mode }}
          SELFTEST_RESULT: ${{ needs.mutation-selftest.result }}
          SHARDS_RESULT: ${{ needs.mutation-shards.result }}
        run: test "$MODE" = full && test "$SELFTEST_RESULT" = success && test "$SHARDS_RESULT" = success
      - uses: actions/download-artifact@v4
        if: needs.changes.outputs.mutation_mode == 'full'
        with:
          pattern: mutation-shard-*
          path: target/mutation-shards
          merge-multiple: true
      - name: Verify every current control exactly once against this candidate
        if: needs.changes.outputs.mutation_mode == 'full'
        run: >
          python3 tools/mutation_shards.py --artifacts target/mutation-shards
          --count ${{ needs.changes.outputs.shard_count }}
          --revision "$GITHUB_SHA" --output target/mutation-gate.json
      - name: Retain rejection when collection could not start
        if: always() && needs.changes.outputs.docs_only != 'true'
        env:
          MODE: ${{ needs.changes.outputs.mutation_mode }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          SELFTEST_RESULT: ${{ needs.mutation-selftest.result }}
          SHARDS_RESULT: ${{ needs.mutation-shards.result }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('target/mutation-gate.json')
          if not p.exists():
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(json.dumps({'complete': False, 'revision': os.environ['GITHUB_SHA'],
                  'rejection': 'collection not reached; see job results',
                  'jobs': {k: os.environ[k] for k in ('MODE', 'CHANGES_RESULT', 'SELFTEST_RESULT', 'SHARDS_RESULT')}}, indent=2))
          PY
      - name: Keep combined evidence or rejection
        if: always() && needs.changes.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mutation-gate
          path: target/mutation-gate.json
          if-no-files-found: error
