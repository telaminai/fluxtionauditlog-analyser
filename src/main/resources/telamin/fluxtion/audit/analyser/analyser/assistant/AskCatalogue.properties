# M74 P2 (spec-claude-code-provider.md §5.5, §5.8): every "Ask" question the analyser can draft, the start page's
# entries, and the analyser's own drafts that are not questions. ONE file, so a new question is one entry in
# AskCatalogue and the lines below; AskCatalogueTest iterates the registry and fails on a missing key.
#
# Placeholders are {name}; only the pointer names AskCatalogue knows are replaced, each through its sanitiser
# (AskPointers). Text such as {recordIndex: 12} is literal. English only in P2, looked up for Locale.getDefault().

# ---- the label prefix by mode (§5.5 "How each behaves, by mode") ----------------------------------------------------
mode.CLAUDE_CODE=Ask Claude: {question}
mode.IN_APP=Ask the assistant: {question}

# ---- the questions ----------------------------------------------------------------------------------------------------
Q1.label=What happened here?
Q1.template=What happened in record #{index} of {log} (log generation {gen})? Read it with analyser_read {recordIndex: {index}} and the {before} records before and {after} after (#{from}–#{to}). Its cycle logged from these nodes: {nodeIds}. Say what the cycle did and why.
Q1.noNodes=(none it logged)

Q2.label=Compare these rows
Q2.template=Compare records {indexes} of {log} (log generation {gen}). Read them with analyser_read. {diffKeys}Say what differs and what caused it.
Q2.diffKeys=They differ in: {keys}.
Q2.diffButton=Ask Claude about this diff
Q2.diffButton.IN_APP=Ask the assistant about this diff

Q3.label=Why did this node fire / not fire?
Q3.template=In {graph}, node {nodeId} {logged} in record #{index} of {log} (log generation {gen}) — the analyser's coverage reading, and silence is not proof it did not run. Why did it {fire}? Use analyser_topology and analyser_read.
Q3.logged=logged
Q3.notLogged=did not log
Q3.fire=fire
Q3.notFire=not fire
Q3.noGraph=the open graph

Q4.label=Explain this point
Q4.menu=explain this point
Q4.template=On chart {chart}, series {expr} at {time} (nearest record #{index}, log generation {gen}){note}: explain what the log shows around this point. Use analyser_series and analyser_read.
Q4.note=, where there is note {noteNumber}

Q5.label=Explain this finding
Q5.template=Record #{index} of {log} (log generation {gen}) is flagged as a finding. Read the record with analyser_read and the finding through analyser_context, and explain whether the record supports it.

Q6.label=Summarise this window
Q6.template=Summarise {log} (log generation {gen}) between {fromTime} and {toTime} — records #{first}–#{last}, {count} records. Use analyser_aggregate and analyser_series over that window; read records only to illustrate.

# ---- the start page's entries (§5.8) -----------------------------------------------------------------------------------
S1.label=Run me through a demo
S1.verb=Play
S1.does=Play: opens the sample project and plays the DEMO journey — no AI, no network, nothing sent
S2.label=Set up a project from my code
S2.verb=Set up…
S2.does=Set up…: choose your code's folder. Claude Code looks and proposes the set-up; you answer each item and the analyser applies it (the in-app assistant opens New project… instead)
S2.template=Set this folder up as an analyser project: find the processor, the GraphML, the source roots and the runbooks that fit it (and the open log, if one is open), then call analyser_propose. Do not change any file.
S2.inAppWhy=The in-app assistant cannot read a folder, so New project… opens instead: it offers what it finds, and you choose.
S3.label=Open an evidence bundle someone sent me
S3.verb=Open bundle…
S3.does=Open bundle…: choose an .fexp, verify it, then draft a question about it
S3.template=Explain what the evidence bundle {bundle} contains and what its verification checked. Start with analyser_context.
S4.label=Which starter template suits what I'm building?
S4.verb=Show templates
S4.does=Show templates: read the starter catalogue, then draft a question naming its templates
S4.template=Which starter template suits what I'm building: {text}? The templates offered are: {templates}.
S4.describe=describe it here
S4.unreachable=(the template list could not be read)
S5.label=Explain an audit log I already have
S5.verb=Open log…
S5.does=Open log…: choose an audit log, then draft a question about it
S5.template=Explain this audit log: {log} (log generation {gen}) — what produced it, what happened, and anything unusual. Start with analyser_context.
S6.label=What can this tool do?
S6.template=What can the Fluxtion Audit Log Analyser do for me? Start with analyser_context; the user guide is at {docsUrl}.
S6.hint=In the analyser assistant's posture Claude has no web tool: it answers from analyser_context, its tools' descriptions and the folder's CLAUDE.md.

# ---- the analyser's own drafts that are not questions (F11: the static rule covers them) ---------------------------------
JOURNEY.template=About the walk {walk} on {log} (log generation {gen}):
HANDOFF.template=We are moving from {source} to {target}. For a new Claude Code session there, summarise what we found, what is open, and what to do next. Name records by index and charts by name; leave out secrets and machine paths.
HANDOFF.armed=Read the handoff report {title} (call analyser_context, then analyser_report {list}) and continue from it.
SETUP.template=Help me set up an analyser project for the code in this folder. Start with analyser_context, read the folder with Read, Grep and Glob, then propose the set-up with analyser_propose.

