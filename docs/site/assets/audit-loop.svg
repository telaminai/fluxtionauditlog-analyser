<svg viewBox="0 0 960 310" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The audit loop: your EventProcessor emits an audit log, the analyser opens it, the LLM assistant investigates and drives the analyser back, you fix and redeploy, and a fresh audit log verifies the fix.">
 <title>The audit loop</title>
 <desc>EventProcessor emits an audit log; the analyser opens it; evidence flows to the LLM assistant and actions (graph, flag, filter) flow back into the analyser; the verified root cause leads to a fix and redeploy; a fresh audit log closes the loop.</desc>
 <defs>
  <marker id="arrowMain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--md-primary-fg-color, #3f51b5)"/></marker>
  <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--md-accent-fg-color, #ff6e42)"/></marker>
  <marker id="arrowLoop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--md-default-fg-color--light, #8a8f98)"/></marker>
 </defs>
 <path d="M 820 78 L 820 40 Q 820 30 810 30 L 125 30 Q 115 30 115 40 L 115 72" fill="none" stroke="var(--md-default-fg-color--light, #8a8f98)" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrowLoop)"/>
 <text x="467" y="22" text-anchor="middle" font-size="13.5" fill="var(--md-default-fg-color--light, #6b7280)">redeploy — a fresh audit log verifies the fix</text>
 <rect x="20" y="78" width="190" height="80" rx="10" fill="var(--md-code-bg-color, #f6f8fa)" stroke="var(--md-default-fg-color--lighter, #c9ced6)" stroke-width="1.4"/>
 <text x="115" y="112" text-anchor="middle" font-size="15.5" font-weight="600" fill="var(--md-default-fg-color, #1f2937)">Your EventProcessor</text>
 <text x="115" y="134" text-anchor="middle" font-size="12.5" fill="var(--md-default-fg-color--light, #6b7280)">Fluxtion · Mongoose app</text>
 <rect x="255" y="78" width="190" height="80" rx="10" fill="var(--md-code-bg-color, #f6f8fa)" stroke="var(--md-default-fg-color--lighter, #c9ced6)" stroke-width="1.4"/>
 <text x="350" y="112" text-anchor="middle" font-size="15.5" font-weight="600" fill="var(--md-default-fg-color, #1f2937)">Audit log</text>
 <text x="350" y="134" text-anchor="middle" font-size="12.5" fill="var(--md-default-fg-color--light, #6b7280)">replayable per-cycle trace</text>
 <rect x="490" y="78" width="190" height="80" rx="10" fill="var(--md-code-bg-color, #f6f8fa)" stroke="var(--md-primary-fg-color, #3f51b5)" stroke-width="1.6"/>
 <text x="585" y="112" text-anchor="middle" font-size="15.5" font-weight="600" fill="var(--md-default-fg-color, #1f2937)">Analyser</text>
 <text x="585" y="134" text-anchor="middle" font-size="12.5" fill="var(--md-default-fg-color--light, #6b7280)">browse · graph · source</text>
 <rect x="725" y="78" width="190" height="80" rx="10" fill="var(--md-code-bg-color, #f6f8fa)" stroke="var(--md-default-fg-color--lighter, #c9ced6)" stroke-width="1.4"/>
 <text x="820" y="112" text-anchor="middle" font-size="15.5" font-weight="600" fill="var(--md-default-fg-color, #1f2937)">Fix &amp; redeploy</text>
 <text x="820" y="134" text-anchor="middle" font-size="12.5" fill="var(--md-default-fg-color--light, #6b7280)">verified against source</text>
 <g stroke="var(--md-primary-fg-color, #3f51b5)" stroke-width="2" fill="none">
  <line x1="210" y1="118" x2="248" y2="118" marker-end="url(#arrowMain)"/>
  <line x1="445" y1="118" x2="483" y2="118" marker-end="url(#arrowMain)"/>
  <line x1="680" y1="118" x2="718" y2="118" marker-end="url(#arrowMain)"/>
 </g>
 <rect x="490" y="228" width="190" height="66" rx="10" fill="var(--md-code-bg-color, #f6f8fa)" stroke="var(--md-accent-fg-color, #ff6e42)" stroke-width="1.6"/>
 <text x="585" y="256" text-anchor="middle" font-size="15.5" font-weight="600" fill="var(--md-default-fg-color, #1f2937)">LLM assistant</text>
 <text x="585" y="277" text-anchor="middle" font-size="12.5" fill="var(--md-default-fg-color--light, #6b7280)">investigates &amp; explains</text>
 <line x1="547" y1="158" x2="547" y2="221" stroke="var(--md-accent-fg-color, #ff6e42)" stroke-width="2" marker-end="url(#arrowAccent)"/>
 <line x1="623" y1="228" x2="623" y2="165" stroke="var(--md-accent-fg-color, #ff6e42)" stroke-width="2" marker-end="url(#arrowAccent)"/>
 <text x="535" y="196" text-anchor="end" font-size="12.5" fill="var(--md-default-fg-color--light, #6b7280)">evidence: records · aggregates · source</text>
 <text x="635" y="196" text-anchor="start" font-size="12.5" fill="var(--md-default-fg-color--light, #6b7280)">actions: graph · flag · filter · goto</text>
</svg>
